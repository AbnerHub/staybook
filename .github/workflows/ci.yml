name: StayBook CI

on:
  push: #Ejecuta el pipeline cuando haya un push a develop o main
    branches:
      - develop
      - main
  pull_request: #Ejecuta el pipeline cuando alguien cree o actualice un Pull Request hacia esas ramas.
    branches:
      - develop
      - main

jobs:
  test:

    runs-on: ubuntu-latest #runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies #Instalamos las librerías necesarias para ejecutar la aplicación y los tests.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show dependency versions
        run: |
          python --version
          pip show fastapi starlette httpx httpx2 || true

      - name: Run tests
        run: |
          pytest